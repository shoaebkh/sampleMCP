spring.application.name=sampleMCP

# Render (and most PaaS providers) inject the port to listen on via the PORT
# env var. Falls back to 8080 for local development.
server.port=${PORT:8080}

# Keep startup logs lean; bump to DEBUG when troubleshooting the MCP transport.
logging.level.io.modelcontextprotocol=INFO

# Salesforce JWT Bearer flow credentials (see README.md for setup). All
# optional: if unset, salesforce_get_account/salesforce_create_case are
# simply not registered as MCP tools at startup.
salesforce.login-url=${SF_LOGIN_URL:https://login.salesforce.com}
salesforce.client-id=${SF_CLIENT_ID:}
salesforce.username=${SF_USERNAME:}
salesforce.private-key-pem=${SF_PRIVATE_KEY_PEM:}
